[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "modelmapper"
version = "0.2.0"
description = "Map and label the MLP neurons of a language model: which concepts need them (knockouts), and what each part of each neuron does (self-checked labels)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "James Phoenix" }]
requires-python = ">=3.10"
# The versions every published result used (requirements.txt). Install torch first from the index for your hardware
# (SETUP.md); a CUDA build such as 2.11.0+cu128 satisfies torch==2.11.0.
dependencies = [
    "torch==2.11.0",
    "transformers==5.20.0",
    "accelerate==1.15.0",
    "tokenizers==0.23.3",
    "safetensors==0.8.0",
    "huggingface_hub==2.2.0",
    "numpy==2.4.6; python_version >= '3.11'",
    "numpy==2.2.6; python_version < '3.11'",
    "pyarrow==26.0.0; python_version >= '3.11'",
    "pyarrow==25.0.1; python_version < '3.11'",
    "httpx==0.28.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]
ledger = ["duckdb>=1.1"]          # only for scorecard.knockout_from_ledger

[project.scripts]
modelmapper = "modelmapper.cli:main"

[tool.setuptools.packages.find]
include = ["modelmapper*"]

[tool.setuptools.package-data]
modelmapper = ["answer_keys/*.json", "data/ranges/*.pt", "data/labels/*.json.gz", "data/check/*.npz", "data/check/*.json.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rs"     # always list skipped tests with the reason (e.g. which model to download)
markers = [
    "model: loads a real model (Qwen3-0.6B; a few minutes on a CPU); deselect with -m 'not model'",
    "repro: compares a ported v3 stage with the research run's files (Qwen3-8B weights + MODEL_MAPPER_V3_REF)",
]
