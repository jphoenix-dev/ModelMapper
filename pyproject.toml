[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "modelmapper"
version = "0.1.0"
description = "Find which MLP neurons of a language model a concept depends on, measured by switching them off."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "James Phoenix" }]
requires-python = ">=3.10"
# The versions every published result used (requirements.txt). Install torch first from the index for your hardware
# (SETUP.md); a CUDA build such as 2.11.0+cu128 satisfies torch==2.11.0.
dependencies = [
    "torch==2.11.0",
    "transformers==5.20.0",
    "accelerate==1.15.0",
    "tokenizers==0.23.3",
    "safetensors==0.8.0",
    "huggingface_hub==2.2.0",
    "numpy==2.4.6; python_version >= '3.11'",
    "numpy==2.2.6; python_version < '3.11'",
    "pyarrow==26.0.0; python_version >= '3.11'",
    "pyarrow==25.0.1; python_version < '3.11'",
    "httpx==0.28.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
modelmapper = "modelmapper.cli:main"

[tool.setuptools.packages.find]
include = ["modelmapper*"]

[tool.setuptools.package-data]
modelmapper = ["answer_keys/*.json", "data/ranges/*.pt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: loads Qwen/Qwen3-0.6B (a few minutes on a CPU); deselect with -m 'not model'"]
