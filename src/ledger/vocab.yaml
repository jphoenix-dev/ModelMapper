# Ledger vocabulary (LEDGER.md). Extensible: add a new entry (with a definition) when an importer needs a new kind.
# Unknown values are accepted but reported by `python src/ledger/build.py --check`.
# claim: one-sentence template rendered by export.py. Fields: {unit} {unit2} {concept} {concept2} {value} {value_text}
# {noise_floor} {threshold} {n} {context} {metric} {uom}. Numbers are formatted to 2 decimals.

unit_kinds:
  neuron: "an MLP neuron (a column of down_proj's input), id letter N"
  head: "an attention head (its slice of o_proj's input), id letter H"

concept_kinds:
  thing: "a named entity or common-noun concept (a Wikipedia-style article - landmark, person, work, idea, object...)"
  era: "a period of time (era:century_19 = the 19th century, 1801-1900; era:c18xx = years written 18xx)"
  relation: "a question type / attribute (relation:year_completed, relation:century, relation:height)"
  value: "an answer value shared across entities when it is not itself a thing or era (value:marble)"
  digit: "a digit token / number word value (digit:7)"
  format: "an answer format (format:year, format:century_word)"

evidence_types:
  recall:
    definition: "concept-level - how many of the concept's recall questions Qwen answers (P >= MIN_P, leak-filtered)"
    claim: "Qwen recalls {concept} on {value} questions"
  concept_stat:
    definition: "concept-level statistics of a map (baseline log-odds, k curves, k to flip); metric names which"
    claim: "{concept}: {metric} = {value}"
  knockout_drop:
    definition: "zeroing the unit (at the positions in context, default all) lowers the answer's log-odds by value (mean over prompts)"
    claim: "Zeroing {unit} lowers {concept} by {value} log-odds (noise floor {noise_floor}; {context})"
  null_knockout_drop:
    definition: "the same measurement for a random control unit (the per-concept noise floor)"
    claim: "Random control {unit}: {concept} changes by {value} log-odds"
  attribution:
    definition: "activation x gradient of the answer's log-prob / log-odds, summed over positions and prompts; rank 1 = strongest"
    claim: "{unit} ranks #{rank} by attribution for {concept}"
  activation:
    definition: "the unit's activation in a stated context (e.g. the answer position)"
    claim: "{unit} activation {value} for {concept} ({context})"
  activation_auc:
    definition: "AUC of the unit's activation separating in-group from out-group items (concept = the in-group), sign fixed as stated in details"
    claim: "{unit} picks out {concept} with AUC {value} ({context})"
  role:
    definition: "weights-based role of a unit for a concept's answer (say / attribute / late-other / early), from its direct effect on the answer token"
    claim: "{unit} is a '{value_text}' neuron for {concept}"
  readout_tokens:
    definition: "tokens a unit pushes (direct logit of its output vector, or forced readout); an informal reading, never a label"
    claim: "{unit} pushes: {value_text}"
  position_split:
    definition: "knockout drop when the unit is zeroed only at a subset of positions (context says which)"
    claim: "Zeroing {unit} only at {context} lowers {concept} by {value} log-odds"
  job_class:
    definition: "a class assigned by a stated rule from causal tests (entity / relation / answer-value / fact-specific / generic / digit / era / prefix)"
    claim: "{unit} is a {value_text} neuron ({concept})"
  specificity:
    definition: "the unit's effect on its own concept vs on others (metric says which: own_drop, others_drop, ratio)"
    claim: "{unit}: {metric} = {value} for {concept}"
  sharing:
    definition: "a unit found for concept matters causally for concept2 too (value = drop on concept2)"
    claim: "{unit}, found for {concept}, also lowers {concept2} by {value} log-odds"
  causal_route:
    definition: "zeroing unit changes unit2's activation (value = relative drop) for concept"
    claim: "Zeroing {unit} changes {unit2}'s activation by {value} (relative) for {concept} ({context})"
  feeder:
    definition: "unit is among the strongest upstream contributors (activation x gradient) to unit2's activation on concept"
    claim: "{unit} feeds {unit2} on {concept} (score {value})"
  fanout:
    definition: "driving unit up (dose in context) changes unit2's activation (value = normalised effect)"
    claim: "Driving {unit} moves {unit2} by {value} ({context})"
  dose_response:
    definition: "the unit's activation scaled across a dose series; metric names the response measured (e.g. spearman of expected digit)"
    claim: "{unit}: dose response {metric} = {value} for {concept}"
  digit_shift:
    definition: "where probability lost by a knockout goes among digit tokens (metric names the statistic)"
    claim: "{unit}: {metric} = {value} for {concept}"
  label:
    definition: "a blind input-side label of the unit's web-text firings (Luna), with its grading in details"
    claim: "Input label for {unit}: {value_text}"
  web_firing_share:
    definition: "share of the unit's web-text firings judged about / related to / unrelated to the concept"
    claim: "{value} of {unit}'s web firings are {metric} {concept}"
  search_verify:
    definition: "a concept-to-neuron proposal tested causally (atlas / search-then-verify); value = drop, passes = verified"
    claim: "{unit} proposed for {concept}: verified drop {value}"
  forced_readout:
    definition: "forcing the unit to a multiple of its natural peak; value = consistency of the top word across backgrounds"
    claim: "Forcing {unit} ({context}): top-word consistency {value}"
  specificity_gradient:
    definition: "zeroing a concept's neurons changes facts about concept2 (a nearby / similar concept) by value"
    claim: "Zeroing {concept}'s neurons lowers {concept2} by {value} log-odds ({context}; noise floor {noise_floor})"
  shared_use:
    definition: "unit-level statistics of a neuron in the top-k of several concepts' maps; metric says which (n_users, sign_agreement, section_same, p31_same, role_pattern)"
    claim: "{unit}, shared by several maps: {metric} = {value}{value_text} (chance {noise_floor})"
  feeder_overlap:
    definition: "Jaccard overlap of top-20 feeder sets - without unit2: the same unit across its user concepts; with unit2: two units on the same concept"
    claim: "{unit}'s feeders overlap {value} ({metric}; chance {noise_floor})"
  job_name:
    definition: "a short convenience name for a unit's job (Luna), blind-checked (Jev) on a held-out concept; value = p on the held-out concept, noise_floor = the control p; a label for convenience, NOT the unit's true meaning"
    claim: "Convenience name for {unit}: '{value_text}' (blind check p {value} on held-out {concept}; control {noise_floor}) - a label to help reading, not its true meaning"
  causal_link:
    definition: "zeroing unit changes later unit2's activation at the answer position for concept (value = mean relative drop, signed: + supports, - suppresses); noise_floor = |mean drop| for unit's activation-matched null"
    claim: "Zeroing {unit} changes {unit2} by {value} (relative) for {concept} ({context}; null {noise_floor})"
  graph_edge:
    definition: "attribution graph: the DIRECT contribution of unit (or an embedding / node in context) to unit2's activation (or the target), through the frozen linearised model"
    claim: "In {concept}'s attribution graph, {unit} contributes {value} directly to {unit2} ({context})"
# notes: web_firing_share may carry metric 'skipped' (a judge job that did not run; kept for completeness).
#        label rows carry coverage in value and passes = the 'clean' rule of their set (census or H-DEPTH; threshold column = the bar).
